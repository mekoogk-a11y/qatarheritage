<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="qatarMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A1538"/>
      <stop offset="50%" stop-color="#70112c"/>
      <stop offset="100%" stop-color="#4e0a1e"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA7"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA820A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Shield with Rounded Corners -->
  <rect width="512" height="512" rx="104" fill="url(#qatarMaroon)"/>
  
  <!-- Subtle Ornamental Inner Border -->
  <rect x="20" y="20" width="472" height="472" rx="88" fill="none" stroke="url(#goldAccent)" stroke-width="3" stroke-opacity="0.35"/>

  <!-- Iconic 9-toothed serration from the Qatar Flag -->
  <g opacity="0.12" fill="#FFFFFF">
    <polygon points="50,120 110,136 50,152"/>
    <polygon points="50,152 110,168 50,184"/>
    <polygon points="50,184 110,200 50,216"/>
    <polygon points="50,216 110,232 50,248"/>
    <polygon points="50,248 110,264 50,280"/>
    <polygon points="50,280 110,296 50,312"/>
    <polygon points="50,312 110,328 50,344"/>
    <polygon points="50,344 110,360 50,376"/>
    <polygon points="50,376 110,392 50,408"/>
  </g>

  <!-- Central Emblem: Traditional Qatari Dhow Boat & Pearl -->
  <g filter="url(#shadow)" transform="translate(4, -10)">
    <!-- Main Dhow Sail (White) -->
    <path d="M 256 90 Q 320 180 345 280 L 256 280 Z" fill="#FFFFFF"/>
    <!-- Secondary Small Sail -->
    <path d="M 242 140 Q 185 210 165 280 L 242 280 Z" fill="#F1F5F9" opacity="0.95"/>
    
    <!-- Dhow Hull (Traditional Wooden Teak) -->
    <path d="M 120 295 Q 240 370 395 300 Q 340 365 210 365 Q 145 365 120 295 Z" fill="url(#goldAccent)"/>
    
    <!-- Luminous Pearl in Oyster Base -->
    <circle cx="256" cy="385" r="32" fill="#FFFFFF"/>
    <circle cx="256" cy="385" r="32" fill="url(#goldAccent)" opacity="0.3"/>
    <circle cx="248" cy="375" r="10" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Decorative Stars / Compass Points -->
  <circle cx="256" cy="62" r="5" fill="#D4AF37"/>
  <circle cx="256" cy="445" r="5" fill="#D4AF37"/>
  <circle cx="70" cy="256" r="5" fill="#D4AF37"/>
  <circle cx="442" cy="256" r="5" fill="#D4AF37"/>

  <!-- Arabic Typography Motif -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF" letter-spacing="2">اكتشف قطر</text>
</svg>
